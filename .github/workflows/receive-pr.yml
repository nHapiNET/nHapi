name: Receive Pull Request

on: [pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build And Test ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore nHapi (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dotnet restore nHapi.sln --configfile build\.nuget\NuGet.config

      - name: Restore nHapi (Non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          dotnet restore nHapi.sln --configfile build/.nuget/NuGet.config

      - name: Build nHapi
        run: |
          dotnet build nHapi.sln -c Release --no-restore

      - name: Run tests for all target frameworks (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dotnet test --project tests\NHapi.Base.NUnit\NHapi.Base.NUnit.csproj --report-trx --results-directory TestResults -c Release -f net462 --no-restore --no-build
          dotnet test --project tests\NHapi.Base.NUnit\NHapi.Base.NUnit.csproj --report-trx --results-directory TestResults -c Release -f net10.0 --no-restore --no-build
          dotnet test --project tests\NHapi.NUnit.SourceGeneration\NHapi.NUnit.SourceGeneration.csproj --report-trx --results-directory TestResults -c Release -f net10.0 --no-restore --no-build
          dotnet test --project tests\NHapi.NUnit\NHapi.NUnit.csproj --report-trx --results-directory TestResults -c Release -f net462 --no-restore --no-build
          dotnet test --project tests\NHapi.NUnit\NHapi.NUnit.csproj --report-trx --results-directory TestResults -c Release -f net10.0 --no-restore --no-build

      - name: Run Benchmatks (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dotnet run -c Release --project tests\NHapi.Benchmarks\NHapi.Benchmarks.csproj -f net10.0 --no-restore --no-build

      - name: Run tests for all target frameworks (Non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          dotnet test --project tests/NHapi.Base.NUnit/NHapi.Base.NUnit.csproj --results-directory TestResults --results-directory-layout per-module --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml -c Release -f net10.0 --no-restore --no-build
          dotnet test --project tests/NHapi.NUnit.SourceGeneration/NHapi.NUnit.SourceGeneration.csproj --results-directory TestResults -c Release -f net10.0 --no-restore --no-build
          dotnet test --project tests/NHapi.NUnit/NHapi.NUnit.csproj --results-directory TestResults --results-directory-layout per-module --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml -c Release -f net10.0 --no-restore --no-build

      - name: Upload Unit Test Results
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults\*.trx

      - name: Upload Benchmark Results
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts\results

      - name: Upload Code Coverage Report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: TestResults/
