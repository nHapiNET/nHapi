name: Build Status
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build And Test ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore nHapi (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dotnet restore nHapi.sln --configfile build\.nuget\NuGet.config

      - name: Restore nHapi (Non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          dotnet restore nHapi.sln --configfile build/.nuget/NuGet.config

      - name: Build nHapi
        run: |
          dotnet build nHapi.sln -c Release --no-restore

      - name: Run tests for all target frameworks (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dotnet test tests\NHapi.Base.NUnit\NHapi.Base.NUnit.csproj --results-directory TestResults -c Release -f net462 --no-restore --no-build
          dotnet test tests\NHapi.Base.NUnit\NHapi.Base.NUnit.csproj --results-directory TestResults -c Release -f net10.0 --no-restore --no-build
          dotnet test tests\NHapi.NUnit.SourceGeneration\NHapi.NUnit.SourceGeneration.csproj --results-directory TestResults -c Release -f net10.0 --no-restore --no-build
          dotnet test tests\NHapi.NUnit\NHapi.NUnit.csproj --results-directory TestResults -c Release -f net462 --no-restore --no-build
          dotnet test tests\NHapi.NUnit\NHapi.NUnit.csproj --results-directory TestResults -c Release -f net10.0  --no-restore --no-build

      - name: Run Benchmatks (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dotnet run -c Release --project tests\NHapi.Benchmarks\NHapi.Benchmarks.csproj -f net10.0 --no-restore --no-build

      - name: Run tests for all target frameworks (Non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          dotnet test tests/NHapi.Base.NUnit/NHapi.Base.NUnit.csproj --collect:"XPlat Code Coverage" --results-directory TestResults -c Release -f net10.0 --no-restore --no-build
          dotnet test tests/NHapi.NUnit.SourceGeneration/NHapi.NUnit.SourceGeneration.csproj --collect:"XPlat Code Coverage" --results-directory TestResults -c Release -f net10.0 --no-restore --no-build
          dotnet test tests/NHapi.NUnit/NHapi.NUnit.csproj --collect:"XPlat Code Coverage" --results-directory TestResults -c Release -f net10.0 --no-restore --no-build

      - name: Upload Benchmark Results
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts\results

      - name: Upload Code Coverage Report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: TestResults/

  publish-coverage-results:
    needs: build-and-test
    name: Publish Code Coverage Results
    runs-on: ubuntu-latest
    # the build-and-test job might be skipped, we don't need to run this job then
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: "Download artifact"
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: ${{ runner.temp }}/artifacts

      - name: Download Codacy Coverage Reporter
        env:
          CODACY_REPORTER_VERSION: 14.1.3
          CODACY_REPORTER_SHA256: 15c5f052207d27b8501ab5d5910c68c206ea70b0157ee1725132780530580875
        run: |
          reporter="$RUNNER_TEMP/codacy/codacy-coverage-reporter"
          mkdir -p "$(dirname "$reporter")"
          curl -fsSL --retry 3 -o "$reporter" \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/${CODACY_REPORTER_VERSION}/codacy-coverage-reporter-linux"
          echo "${CODACY_REPORTER_SHA256}  ${reporter}" | sha256sum --check --strict
          chmod +x "$reporter"

      - name: Publish Code Coverage Results
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          reports=()
          while IFS= read -r -d '' file; do
            reports+=(-r "$file")
          done < <(find "$RUNNER_TEMP/artifacts" -type f -name "coverage.cobertura.xml" -print0)

          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No coverage reports found in artifact"
            exit 1
          fi

          reporter="$RUNNER_TEMP/codacy/codacy-coverage-reporter"
          "$reporter" report "${reports[@]}" --partial &&\
          "$reporter" final

  report-benchmark-results:
    needs: build-and-test
    name: Report Benchmark Results
    runs-on: ubuntu-latest
    # the build-and-test job might be skipped, we don't need to run this job then
    if: always()
    steps:
      - name: 'Download artifact'
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/artifacts

      - name: 'Report benchmark result'
        run: cat "$RUNNER_TEMP/artifacts/NHapi.Benchmarks.LargeEmbeddedFileTest-report-github.md" >> "$GITHUB_STEP_SUMMARY"
