# Dependabot version updates. Each ecosystem raises one grouped PR per week, so PRs
# no longer pile up per directory and hit the open PR limit.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    # "/" picks up .config/dotnet-tools.json
    directories:
      - "/"
      - "/src/*"
      - "/tests/*"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns:
          - "*"
